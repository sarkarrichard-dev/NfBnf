[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-ai-workstation"
version = "0.1.0"
description = "Indian equity research/trading helpers: pandas locally, intelligence via HTTP APIs."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "yfinance>=0.2.40",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "datasets>=2.18",
  "huggingface_hub>=0.24",
]

[project.scripts]
trading-ai-start = "trading_ai_engine.server.main:run"
trading-ai-import-files = "trading_ai_engine.ml.ingest_cli:main"
trading-ai-hugging-face = "trading_ai_engine.ml.hf_cli:main"
trading-ai-learn-market = "trading_ai_engine.ml.market_learn_cli:main"
trading-ai-eval-research = "trading_ai_engine.research.eval_harness:main"
trading-ai-train-hf-text = "trading_ai_engine.ml.hf_text_head_train:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
e2e = ["playwright>=1.40"]
data = ["openpyxl>=3.1", "pyarrow>=15.0"]
hf = ["datasets>=2.18", "huggingface_hub>=0.24"]
hf_train = ["scikit-learn>=1.3", "joblib>=1.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["trading_ai_engine*"]

[tool.pytest.ini_options]
markers = [
  "unit: isolated logic (no live HTTP server)",
  "integration: FastAPI TestClient + SQLite",
  "smoke: critical API paths",
  "security: URL / safety helpers",
  "e2e: browser tests (Playwright; use ``RUN_E2E=1`` and ``pip install -e '.[e2e]'`` + ``playwright install chromium``)",
]
addopts = "-m \"not e2e\""

[tool.ruff]
line-length = 100
target-version = "py311"
