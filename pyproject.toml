[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "index-options-ai"
version = "0.1.0"
description = "CPR, EMA, and OI intraday workstation for NIFTY and BANKNIFTY index options."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "pydantic>=2.7",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "huggingface-hub>=0.23",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8"]
# Offline FinBERT: pip install -e ".[hf-local]"  (large torch download)
hf-local = ["transformers>=4.40", "torch>=2.2"]

[project.scripts]
start-index-ai = "index_ai.server:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["index_ai*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["reference"]
